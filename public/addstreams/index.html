<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Stream Syncer</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b10;
        color: #e8e8f0;
        font: 16px/1.5 system-ui, sans-serif;
      }
      a { color: #a970ff; }
    </style>
    <script>
      // /addstreams?kanaal+kanaal → /?kanaal+kanaal (werkt op elk subpad).
      const target =
        location.pathname.replace(/\/?addstreams\/?$/i, '/') + location.search + location.hash;
      location.replace(target);
    </script>
  </head>
  <body>
    <p>Doorsturen naar <a id="link" href="/">Stream Syncer</a>…</p>
    <script>
      document.getElementById('link').href =
        location.pathname.replace(/\/?addstreams\/?$/i, '/') + location.search + location.hash;
    </script>
  </body>
</html>
